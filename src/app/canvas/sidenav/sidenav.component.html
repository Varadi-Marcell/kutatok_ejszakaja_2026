<div class="sidenav" [class.collapsed]="isCollapsed">
  <ul class="list-group">
    <li class="list-group-item custom-group-item" style="cursor: pointer" *ngFor="let panorama of panoramas"
        (click)="selectPanorama(panorama)">
      {{ panorama.name }}
    </li>
  </ul>
</div>

<button class="toggle-btn btn btn-primary" (click)="isCollapsed = !isCollapsed">
  Oldalsáv {{ isCollapsed ? 'Megnyitása' : 'Bezárása' }}
</button>
