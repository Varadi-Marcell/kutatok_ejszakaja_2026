<div #scene class="scene">

  <app-svg-element
    #svgComponent
    class="img-fluid"
    [config]="currentSvgConfig"
    [highlightedAreaId]="highlightedAreaId"
    (areaClick)="onAreaClick($event)">
  </app-svg-element>

  <!-- Bal felső blokk: Oxford stílusú eszköztár (kereső + gombok) + épület gombok alatta -->
  <div class="top-left-stack position-absolute top-0 start-0">
    <app-map-toolbar
      [config]="currentSvgConfig"
      [language]="language"
      (areaSelected)="onSearchAreaSelected($event)"
      (languageChanged)="onLanguageChanged($event)">
    </app-map-toolbar>

    <!-- Térkép váltó gombok – a kereső alatt -->
    <div class="nav-buttons-grid">
      <button class="nav-btn nav-btn-map" (click)="loadNagyterkep()">
        <div class="nav-btn-icon">🗺️</div>
        <div class="nav-btn-text">Campus Térkép</div>
      </button>
      <button class="nav-btn nav-btn-entrance" (click)="loadElocsarnok()">
        <div class="nav-btn-icon">🏢</div>
        <div class="nav-btn-text">Előcsarnok</div>
      </button>
      <button class="nav-btn nav-btn-hall" (click)="loadDiszaula()">
        <div class="nav-btn-icon">🏛️</div>
        <div class="nav-btn-text">Díszaula</div>
      </button>
      <button class="nav-btn nav-btn-old" (click)="loadRegiAula()">
        <div class="nav-btn-icon">📚</div>
        <div class="nav-btn-text">Régi Aula</div>
      </button>
    </div>
  </div>

  <!-- Zoom kontárok – jobb oldali fehér pill (Oxford stílus) -->
  <div class="zoom-pill position-absolute">
    <button class="zoom-pill-btn" (click)="zoomIn()" title="Nagyítás">
      <i class="bi bi-plus-lg"></i>
    </button>
    <div class="zoom-pill-divider"></div>
    <button class="zoom-pill-btn" (click)="zoomOut()" title="Kicsinyítés">
      <i class="bi bi-dash-lg"></i>
    </button>
  </div>
</div>

<!-- Program Popup -->
<app-program-popup
  [programs]="popupPrograms"
  [areaName]="popupAreaName"
  [isVisible]="showPopup"
  [language]="language"
  [selectedProgramName]="selectedProgramName"
  (close)="onClosePopup()">
</app-program-popup>
