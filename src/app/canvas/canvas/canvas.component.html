<p class="pb-4"> </p>
<div class="container-fluid " style="border: 1px solid gray; border-top: 1px solid gray;">

  <div class="row justify-content-center ">
    <div class="col">
      <div #scene class="scene position-relative">

        <app-svg-element 
          #svgComponent
          class="img-fluid mx-auto d-block"
          style="max-height: 90vh; object-fit: contain;"
          [config]="currentSvgConfig"
          (areaClick)="onAreaClick($event)">
        </app-svg-element>
        <div class="p-lg-3 zoom-buttons button-group position-absolute top-0 start-0">
          <div class="button-wrapper">
            <button class="btn btn-secondary" (click)="zoomIn()">+</button>
            <button class="btn btn-secondary" (click)="zoomOut()">-</button>
          </div>
          <div class="svg-selector mt-2">
            <button class="btn btn-primary btn-sm me-1" (click)="loadNagyterkep()">Nagy Térkép</button>
            <button class="btn btn-primary btn-sm me-1" (click)="loadDiszaula()">Díszaula</button>
            <button class="btn btn-primary btn-sm me-1" (click)="loadElocsarnok()">Előcsarnok</button>
            <button class="btn btn-primary btn-sm" (click)="loadRegiAula()">Régi Aula</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Program Popup -->
<app-program-popup
  [programs]="popupPrograms"
  [areaName]="popupAreaName"
  [isVisible]="showPopup"
  (close)="onClosePopup()">
</app-program-popup>
