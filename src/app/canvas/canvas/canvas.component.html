<div class="container-fluid " style="border: 1px solid gray; border-top: 1px solid gray;">

  <div class="row justify-content-center ">
    <div class="col">
      <div #scene class="scene position-relative">

        <app-svg-element
          #svgComponent
          class="img-fluid mx-auto d-block"
          style="max-height: 90vh; object-fit: contain;"
          [config]="currentSvgConfig"
          (areaClick)="onAreaClick($event)">
        </app-svg-element>
        <div class="p-lg-3 zoom-buttons button-group position-absolute top-0 start-0">
          <div class="zoom-controls">
            <button class="zoom-btn zoom-in-btn" (click)="zoomIn()" title="Nagyítás">
              <i class="bi bi-zoom-in"></i>
            </button>
            <button class="zoom-btn zoom-out-btn" (click)="zoomOut()" title="Kicsinyítés">
              <i class="bi bi-zoom-out"></i>
            </button>
          </div>
          <div class="svg-selector mt-2">
            <div class="nav-buttons-grid">
              <button class="nav-btn nav-btn-map" (click)="loadNagyterkep()">
                <div class="nav-btn-icon">🗺️</div>
                <div class="nav-btn-text">Campus Térkép</div>
              </button>
              <button class="nav-btn nav-btn-entrance" (click)="loadElocsarnok()">
                <div class="nav-btn-icon">🏢</div>
                <div class="nav-btn-text">Előcsarnok</div>
              </button>
              <button class="nav-btn nav-btn-hall" (click)="loadDiszaula()">
                <div class="nav-btn-icon">🏛️</div>
                <div class="nav-btn-text">Díszaula</div>
              </button>
              <button class="nav-btn nav-btn-old" (click)="loadRegiAula()">
                <div class="nav-btn-icon">📚</div>
                <div class="nav-btn-text">Régi Aula</div>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Program Popup -->
<app-program-popup
  [programs]="popupPrograms"
  [areaName]="popupAreaName"
  [isVisible]="showPopup"
  (close)="onClosePopup()">
</app-program-popup>
