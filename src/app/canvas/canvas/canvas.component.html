<div #scene class="scene">

  <app-svg-element
    #svgComponent
    class="img-fluid"
    [config]="currentSvgConfig"
    [highlightedAreaId]="highlightedAreaId"
    (areaClick)="onAreaClick($event)">
  </app-svg-element>

  <!-- Bal felső blokk: Oxford stílusú eszköztár (kereső + gombok) + épület gombok alatta -->
  <div class="top-left-stack position-absolute top-0 start-0">
    <app-map-toolbar
      [currentMapId]="currentSvgConfig?.id || null"
      [language]="language"
      (areaSelected)="onSearchAreaSelected($event)"
      (languageChanged)="onLanguageChanged($event)">
    </app-map-toolbar>

    <!-- Térkép váltó gombok – a kereső alatt (ikon + név) -->
    <div class="nav-buttons-grid">
      <button class="nav-btn nav-btn-map" (click)="loadMap('nagyterkep')" title="Campus Térkép">
        <i class="bi bi-map"></i>
        <span class="nav-btn-text">Campus Térkép</span>
      </button>
      <button class="nav-btn nav-btn-entrance" (click)="loadMap('elocsarnok')" title="Előcsarnok">
        <i class="bi bi-door-open"></i>
        <span class="nav-btn-text">Előcsarnok</span>
      </button>
      <button class="nav-btn nav-btn-hall" (click)="loadMap('diszaula')" title="Díszaula">
        <i class="bi bi-bank"></i>
        <span class="nav-btn-text">Díszaula</span>
      </button>
      <button class="nav-btn nav-btn-old" (click)="loadMap('regi_aula')" title="Régi Aula">
        <i class="bi bi-book"></i>
        <span class="nav-btn-text">Régi Aula</span>
      </button>
      <button class="nav-btn nav-btn-lecture" (click)="loadMap('harmas')" title="Előadóterem 3">
        <i class="bi bi-easel2-fill"></i>
        <span class="nav-btn-text">Előadó 3</span>
      </button>
      <button class="nav-btn nav-btn-parking" (click)="loadMap('parkolo')" title="Parkoló">
        <i class="bi bi-p-square"></i>
        <span class="nav-btn-text">Parkoló</span>
      </button>
    </div>
  </div>

  <!-- Zoom kontárok – jobb oldali fehér pill (Oxford stílus) -->
  <div class="zoom-pill position-absolute">
    <button class="zoom-pill-btn" (click)="zoomIn()" title="Nagyítás">
      <i class="bi bi-plus-lg"></i>
    </button>
    <div class="zoom-pill-divider"></div>
    <button class="zoom-pill-btn" (click)="zoomOut()" title="Kicsinyítés">
      <i class="bi bi-dash-lg"></i>
    </button>
  </div>
</div>

<!-- Program Popup -->
<app-program-popup
  [programs]="popupPrograms"
  [areaName]="popupAreaName"
  [isVisible]="showPopup"
  [language]="language"
  [selectedProgramName]="selectedProgramName"
  (close)="onClosePopup()">
</app-program-popup>
