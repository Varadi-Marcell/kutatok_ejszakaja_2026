<div class="svg-container" *ngIf="config">

  <svg
    #svgElement
    #svgMap
    width="100%"
    height="100%"
    [attr.viewBox]="getViewBox()"
    xmlns="http://www.w3.org/2000/svg"
  >
    <image
      [attr.href]="config.svgPath"
      [attr.x]="config.viewBox.x"
      [attr.y]="config.viewBox.y"
      width="100%"
      height="100%"
      preserveAspectRatio="xMidYMid meet"
    ></image>

    <!-- Interactive areas -->
    <g *ngFor="let area of config.interactiveAreas">
      <!-- Polygon areas -->
      <g 
        *ngIf="area.type === 'polygon'"
        [attr.class]="getGroupClass(area)"
        (click)="handleAreaClick(area, $event)"
      >
        <path 
          *ngFor="let pathData of getPolygonPaths(area)"
          [attr.d]="pathData"
          [attr.class]="getPathClass(area)"
          [attr.fill]="area.style?.fillStyle || 'transparent'"
          [attr.stroke]="area.style?.strokeStyle || 'transparent'"
          [attr.stroke-width]="area.style?.strokeWidth || 0"
        ></path>
      </g>
      
      <!-- Rectangle areas -->
      <rect
        *ngIf="area.type === 'rectangle'"
        [attr.class]="getRectClass(area)"
        [attr.x]="getRectangleCoordinates(area)?.x"
        [attr.y]="getRectangleCoordinates(area)?.y"
        [attr.width]="getRectangleCoordinates(area)?.width"
        [attr.height]="getRectangleCoordinates(area)?.height"
        [attr.fill]="area.style?.fillStyle || 'transparent'"
        [attr.stroke]="area.style?.strokeStyle || 'transparent'"
        [attr.stroke-width]="area.style?.strokeWidth || 0"
        [attr.transform]="getRectangleCoordinates(area)?.transform"
        (click)="handleAreaClick(area, $event)"
      ></rect>
      
      <!-- Circle areas -->
      <circle
        *ngIf="area.type === 'circle'"
        [attr.class]="getCircleClass(area)"
        [attr.cx]="getCircleCoordinates(area)?.cx"
        [attr.cy]="getCircleCoordinates(area)?.cy"
        [attr.r]="getCircleCoordinates(area)?.r"
        [attr.fill]="area.style?.fillStyle || 'transparent'"
        [attr.stroke]="area.style?.strokeStyle || 'transparent'"
        [attr.stroke-width]="area.style?.strokeWidth || 0"
        (click)="handleAreaClick(area, $event)"
      ></circle>

      <!-- Persistent click hint for touch screens and first-time visitors -->
      <circle
        *ngIf="getAreaCenter(area) as center"
        class="hotspot-marker"
        [attr.cx]="center.x"
        [attr.cy]="center.y"
        [attr.r]="getHotspotRadiusForArea(area)"
        [attr.stroke-width]="getHotspotStrokeWidth(area)"
        (click)="handleAreaClick(area, $event)"
      >
        <title>{{ area.name }}</title>
      </circle>

      <!-- Angol-ajánlott / akadálymentesített mini badge-ek a standon -->
      <g
        *ngFor="let badge of getAreaBadges(area)"
        [attr.class]="'area-badge ' + (badge.type === 'en' ? 'area-badge-en' : 'area-badge-access')"
        (click)="handleAreaClick(area, $event)"
      >
        <title>{{ badge.type === 'en'
          ? (language === 'en' ? 'Recommended for English speakers' : 'Angol nyelvűek számára is ajánlott')
          : (language === 'en' ? 'Accessible venue' : 'Akadálymentesített helyszín') }}</title>
        <circle
          class="badge-circle"
          [attr.cx]="badge.x"
          [attr.cy]="badge.y"
          [attr.r]="badge.r"
          [attr.stroke-width]="badge.sw"
        ></circle>
        <text
          *ngIf="badge.type === 'en'"
          class="badge-text"
          [attr.x]="badge.x"
          [attr.y]="badge.y"
          [attr.font-size]="badge.r * 1.5"
          text-anchor="middle"
          dominant-baseline="central"
        >EN</text>
        <path
          *ngIf="badge.type === 'access'"
          class="badge-icon"
          [attr.d]="ACCESS_ICON_PATH"
          [attr.transform]="getAccessIconTransform(badge)"
        ></path>
      </g>
    </g>

    <!-- Jelkulcs a térkép bal alsó sarkába – csak jelölt standok esetén -->
    <g class="badge-legend" *ngIf="getLegendLayout() as legend">
      <rect
        class="legend-bg"
        [attr.x]="legend.x"
        [attr.y]="legend.y"
        [attr.width]="legend.w"
        [attr.height]="legend.h"
        [attr.rx]="legend.fs * 0.6"
      ></rect>
      <ng-container *ngFor="let row of legend.rows">
        <circle
          [attr.class]="'legend-icon-circle ' + row.type"
          [attr.cx]="legend.iconCx"
          [attr.cy]="row.cy"
          [attr.r]="legend.iconR"
          [attr.stroke-width]="legend.iconR * 0.22"
        ></circle>
        <text
          *ngIf="row.type === 'en'"
          class="legend-icon-text"
          [attr.x]="legend.iconCx"
          [attr.y]="row.cy"
          [attr.font-size]="legend.iconR * 1.5"
          text-anchor="middle"
          dominant-baseline="central"
        >EN</text>
        <path
          *ngIf="row.type === 'access'"
          class="legend-icon-access"
          [attr.d]="ACCESS_ICON_PATH"
          [attr.transform]="getLegendAccessTransform(legend, row)"
        ></path>
        <text
          class="legend-label"
          [attr.x]="legend.iconCx + legend.iconR + legend.gap"
          [attr.y]="row.cy"
          [attr.font-size]="legend.fs"
          dominant-baseline="central"
        >{{ row.label }}</text>
      </ng-container>
    </g>
  </svg>

</div>

<div *ngIf="!config" class="no-config-message">
  <p>{{ language === 'en' ? 'No SVG configuration loaded.' : 'Nincs SVG konfiguráció betöltve.' }}</p>
</div>
