<div class="svg-container">

  <svg
    #svgElement
    width="100%"
    height="100%"
    viewBox="0 0 4997 4615"
    xmlns="http://www.w3.org/2000/svg"
  >
    <image
      [attr.href]="imageSrc"
      width="100%"
      height="100%"
      preserveAspectRatio="xMidYMid meet"
    ></image>

    <!-- Group polygons and rectangles together -->
    <g
      *ngFor="let group of elements"
      [attr.class]="'group'"
      (click)="handleGroupClick(group)"
    >
      <path [attr.d]="group.polygon.d" [attr.class]="group.polygon.cssClass"></path>
      <rect
        [attr.x]="group.rectangle.x"
        [attr.y]="group.rectangle.y"
        [attr.width]="group.rectangle.width"
        [attr.height]="group.rectangle.height"
        [attr.fill]="group.rectangle.fillStyle"
        [attr.stroke]="group.rectangle.strokeStyle"
        [attr.stroke-width]="group.rectangle.strokeWidth"
        [attr.transform]="group.rectangle.transform"
      ></rect>
    </g>
  </svg>

</div>
